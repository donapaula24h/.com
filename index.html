<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dona Paula Trufas</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topo">
<h1>🍫 Dona Paula Trufas</h1>
<p>Trufas artesanais feitas com amor</p>
</header>

<section class="slider">
<img class="slide ativo" src="img/slide1.jpg">
<img class="slide" src="img/slide2.jpg">
<img class="slide" src="img/slide3.jpg">
</section>

<div class="busca">
<input type="text" id="pesquisa" placeholder="Pesquisar trufas...">
</div>

<div class="grid" id="produtos"></div>

<button id="btnCarrinho" onclick="abrirCarrinho()">🛒 <span id="contador">0</span></button>

<div id="carrinho" class="carrinho">
<div class="cabecalho">
<h2>Seu Pedido</h2>
<button onclick="abrirCarrinho()">✖</button>
</div>

<div id="itens"></div>

<h3>Total: R$ <span id="total">0,00</span></h3>

<h3>Entrega</h3>
<input id="nome" placeholder="Nome">
<input id="telefone" placeholder="Telefone">
<input id="rua" placeholder="Rua">
<input id="numero" placeholder="Número">
<input id="bairro" placeholder="Bairro">
<textarea id="obs" placeholder="Observações"></textarea>

<button class="finalizar" onclick="finalizarPedido()">Finalizar Pedido</button>
<button class="limpar" onclick="limparCarrinho()">Limpar Carrinho</button>
</div>

<script src="js/script.js"></script>
</body>
</html>
